name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build and verify local publication
        shell: bash
        run: ./gradlew :updater:jvmTest :updater:testAndroidHostTest :updater-compose:jvmTest :updater-compose:testAndroidHostTest :sample-android:assembleDebug :sample-desktop:classes :updater:publishToMavenLocal :updater-compose:publishToMavenLocal
      - name: Consume locally published libraries
        shell: bash
        run: ./gradlew -PusePublishedUpdater=true :sample-android:assembleDebug :sample-desktop:classes
